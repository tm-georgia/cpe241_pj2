services:
  database:
    image: postgres:17-alpine3.22
    platform: linux/amd64
    container_name: banking-db
    restart: always
    shm_size: 128mb
    ports:
      - "${PORT_DB:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-banking_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    platform: linux/amd64
    container_name: banking-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - banking-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: banking-server
    restart: always
    ports:
      - "${PORT_SERVER:-4000}:4000"
    environment:
      PORT: 4000
      HOST: ${HOST_SERVER:-0.0.0.0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@database:5432/banking_db}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - banking-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    platform: linux/amd64
    container_name: banking-client
    restart: always
    ports:
      - "${PORT_CLIENT:-3000}:80"
    depends_on:
      - server
    networks:
      - banking-network

volumes:
  pgdata:

networks:
  banking-network: {}
